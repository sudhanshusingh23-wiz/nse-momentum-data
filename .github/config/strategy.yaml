# strategy.yaml — single source of truth for every parameter in the momentum system.
#
# RULE 1: no skill hardcodes a number. Every skill reads from here.
# RULE 2: all rupee limits are expressed as PERCENTAGES OF THE POOL and resolved at
#         read time, so the quarterly recycling update rescales sizing, heat and
#         concentration limits automatically instead of through 20 manual edits.
# RULE 3: parameters change only at the quarterly review, with walk-forward evidence,
#         and every change is recorded in the changelog at the bottom.
#
# Load with scripts/config.py, which resolves percentages against pool.current
# and applies the capital-scaling table.

version: 3
as_of: "2026-08-30"

# ---------------------------------------------------------------- capital
pool:
  current: 8000000              # 80L. Updated ONLY by the quarterly recycling ledger.
  ceiling: 10000000             # 1Cr. Recycling stops here — see scaling table.
  currency: INR

objective:
  monthly_gross_pct: 5.0        # scoreboard only
  quarterly_gross_target_pct: 15.0
  rolling_4q_target_pct: 60.0
  assessment: quarterly
  # HARD CONSTRAINT: no rule may read P&L versus target. Verify by code inspection.
  target_visible_to_rules: false

recycling:
  enabled: true
  gain_split_to_pool_pct: 50
  gain_split_to_draw_pct: 50
  cadence: quarterly
  deficit_carries_forward: true
  start_after_full_deployment_quarters: 2

# ---------------------------------------------------------------- L1 regime
regime:
  weights:
    index_trend: 0.25
    participation: 0.25
    thrust: 0.15
    smallcap_health: 0.15
    volatility: 0.10
    flow: 0.10
  thresholds:
    risk_on_score: 65
    risk_off_score: 45
    risk_on_gate_pct_above_200dma: 55     # most likely parameter to need revision
    risk_off_floor_pct_above_200dma: 40
    shock_5session_return_pct: -7.0
    shock_vix: 28
  transitions:
    downgrade_confirmation_closes: 1      # immediate: fast to de-risk
    upgrade_confirmation_closes: 3        # slow to re-risk
    upgrade_min_sessions_in_state: 5
    shock_lock_sessions: 10
    reentry_size_ladder_pct: [40, 70, 100]
  benchmark: NIFTY500
  allow_substitute_benchmark: false       # Nifty 50 is NOT a substitute
  states:
    RISK-ON:  {max_deployment_pct: 85, positions: [6, 9], heat_cap_pct: 6.0, max_smallcap_pct: 60}
    NEUTRAL:  {max_deployment_pct: 60, positions: [5, 7], heat_cap_pct: 3.5, max_smallcap_pct: 35}
    RISK-OFF: {max_deployment_pct: 30, positions: [0, 4], heat_cap_pct: 2.0, max_smallcap_pct: 0}
    SHOCK:    {max_deployment_pct: 20, positions: [0, 2], heat_cap_pct: 1.0, max_smallcap_pct: 0}

# ---------------------------------------------------------------- L2 sector
sector:
  weights:
    abs_momentum: 0.30
    risk_adjusted: 0.20
    breadth: 0.20                         # the load-bearing choice; test 0.15 and 0.25
    trend_integrity: 0.15
    acceleration: 0.10
    participation: 0.05
  lookbacks: {r1: 21, r3: 63, r6: 126, r12: 252}
  abs_momentum_blend: {r1: 0.25, r3: 0.35, r6: 0.30, r12: 0.10}
  hysteresis:
    entry_rank_max: 3
    entry_consecutive_weeks: 2
    entry_min_sms: 60
    entry_min_breadth: 50
    retention_rank_max: 5
    retention_min_sms: 50
    retention_min_breadth: 40
    ejection_sms_drop_1week: 15
  correlation_guard_threshold: 0.80
  correlation_lookback_weeks: 12
  allocation: {min_weight: 0.25, max_weight: 0.45}
  min_sectors_for_valid_gates: 12         # below this, percentile gates lose meaning
  min_index_sessions_before_basket_fallback: 130

# ---------------------------------------------------------------- L3 stock
stock:
  weights:
    relative_strength: 0.28
    trend_structure: 0.18
    momentum_quality: 0.14
    volume_participation: 0.14
    acceleration: 0.10
    earnings_momentum: 0.10
    entry_proximity: 0.06
  min_ms_to_select: 55
  max_per_sector: 3
  correlation_max: 0.85
  cap_tilt:
    source: nse_index_membership          # Nifty100=LARGE, Midcap150=MID, Smallcap250=SMALL
    bonus: {SMALL: 7, MID: 4, LARGE: 0}
    bonus_neutral_regime: {SMALL: 3, MID: 4, LARGE: 0}
    min_small_mid_fraction: 0.55
    max_large_fraction: 0.35
  gates:
    g1_min_adv_cr: 5.0
    g1_min_adv_cr_large_position: 8.0
    g2_max_pct_of_adv: 8.0
    g4_max_promoter_pledge_pct: 25
    g6_min_quarters_positive_revenue: 1
    g7_max_opm_decline_bps: 400
    g9_max_circuit_sessions_of_20: 3
    g10_min_sessions_before_results: 3
    g11_min_price: 30
    g12_min_delivery_pct: {SMALL: 30, MID: 25, LARGE: 25}
  unverified_gate_policy: shortlist_only   # never fund an unverified name

# ---------------------------------------------------------------- L4 sizing
sizing:
  composite_blend: {stock_ms: 0.65, sector_sms: 0.35}
  tiers:
    A: {min_composite: 75, risk_pct: 1.00, tranche3: true}
    B: {min_composite: 62, risk_pct: 0.80, tranche3: true}
    C: {min_composite: 55, risk_pct: 0.55, tranche3: false}
  position_pct: {min: 5.0, max: 15.0, max_concentration_mode: 18.0, max_core: 20.0}
  stop: {atr_multiple: 2.0, swing_low_buffer_atr: 0.3, max_pct: 12.0, min_pct: 5.0}
  concentration_mode:
    min_tier_a_candidates: 4
    max_sms_spread: 12
    risk_pct_tier_a: 1.20
    heat_cap_pct: 7.0

# ---------------------------------------------------------------- L5 entry
entry:
  tranches: {t1_pct: 40, t2_pct: 35, t3_pct: 25}
  t1_max_chase_atr: 0.4
  t2_min_sessions: 3
  t2_min_advance_atr: 0.75
  t2_max_ms_decay: 5
  t3_min_r: 1.2
  t3_min_consolidation_sessions: 4
  failed_breakout_sessions: 3
  cooldown_sessions: 15
  cooldown_override_min_ms: 70

# ---------------------------------------------------------------- L6 targets
targets:
  horizon_sessions: 45                    # v2: matches the 2-3 month hold
  horizon_sessions_tier_c: 30
  efficiency_ratio_clamp: {min: 0.25, max: 0.65}
  # Recalibrated 2026-08-30. The original 0.75/0.60/0.45 put the volatility
  # estimator ~3.5x below the R-multiple ladder (2.26 ATR vs 8.00 ATR for tier A
  # T2), so the two methods could never agree and the median was always dragged
  # down by one broken estimator. Solved for agreement at ER=0.45.
  msm_volatility: {A: 2.65, B: 2.00, C: 1.65}
  msm_measured_move: {A: 1.6, B: 1.3, C: 1.0}
  dispersion_max_ratio: 1.40              # above this -> DISPERSED, treat as tier C
  ladder_r:
    A: [{r: 2.0, book_pct: 25}, {r: 4.0, book_pct: 25}, {r: 7.0, book_pct: 25}]
    B: [{r: 1.5, book_pct: 30}, {r: 3.0, book_pct: 35}, {r: 5.0, book_pct: 35}]
    C: [{r: 1.2, book_pct: 40}, {r: 2.5, book_pct: 60}]
  runner: {A: 25, B: 20, C: 0}
  anchor_reconciliation_tolerance_pct: 25
  trailing:
    post_t1_stop_r: 0.5
    post_t2_chandelier_atr: 3.0
    runner_chandelier_atr: 3.5
    runner_weekly_ma: 10
  time_stop:
    sessions: 25
    min_r: 0.5
    require_ms_decay: true
    consolidation_extension_sessions: 15
    consolidation_extension_uses: 2
    new_sector_grace_sessions: 10
  core:
    max_positions: 2
    min_booked_tranche: 1
    min_ms: 72
    min_consecutive_weeks: 2
    min_weekly_closes_above_10wma: 4
    min_unrealised_r: 3.0
    exit_weekly_closes_below_10wma: 2
    exit_min_ms: 55

# ---------------------------------------------------------------- L7 rebalance
rebalance:
  day: saturday
  basis: friday_close
  exit_ms: 42
  trim_ms_range: [42, 55]
  trim_dms_2w: -15
  exit_dms_1w: -10
  exit_dms_1w_max_ms: 60
  add_min_ms: 70
  add_size_pct_of_full: 25
  add_max_count: 2
  add_max_extension_atr: 2.5
  add_min_value: 150000
  stability:
    confirmation_weeks: 2
    min_holding_sessions: 15
    churn_cap_per_week: 2
    ms_smoothing_ema_weeks: 2
    partial_score_may_only_protect: true

# ---------------------------------------------------------------- L8 risk
risk:
  heat_cap_pct: 6.0
  max_sector_pct: 40
  max_thin_liquidity_pct: 30
  max_event_exposure_pct: 25
  max_correlated_positions: 3
  correlation_threshold: 0.75
  drawdown_breakers:
    - {dd_pct: -6,  size_multiplier: 0.75, note: "review last 10 trades before next entry"}
    - {dd_pct: -10, size_multiplier: 0.50, max_positions: 5, heat_cap_pct: 3.5}
    - {dd_pct: -15, action: exit_non_core, max_deployment_pct: 30, freeze_sessions: 10}
    - {dd_pct: -18, action: full_stop, pause_weeks: 4}
  abandonment:
    rolling_4q_below_pct: 8
    consecutive_quarters: 2
    max_drawdown_pct: 25

# ------------------------------------------------- capital scaling (see §2.4)
# Gates tighten as the pool grows. Resolved by config.py against pool.current.
scaling:
  - {pool: 6000000,  adv_floor_cr: 3, adv_preferred_cr: 5,  max_smallcap_pct: 65}
  - {pool: 8000000,  adv_floor_cr: 5, adv_preferred_cr: 8,  max_smallcap_pct: 60}
  - {pool: 10000000, adv_floor_cr: 6, adv_preferred_cr: 10, max_smallcap_pct: 55}
  - {pool: 15000000, adv_floor_cr: 9, adv_preferred_cr: 15, max_smallcap_pct: 40}

# ---------------------------------------------------------------- data
data:
  repo: ""                        # e.g. https://github.com/<user>/nse-momentum-data
  branch: main
  max_staleness_sessions: 2
  artifacts:
    breadth: artifacts/breadth.json
    benchmark: artifacts/nifty500.csv
    smallcap: artifacts/smallcap250.csv
    largecap: artifacts/nifty50.csv      # divergence diagnostic ONLY
    vix: artifacts/vix.csv
    sector_indices: artifacts/sector_indices.csv
    panel: artifacts/panel.csv.gz
    caps: artifacts/caps.csv
    constituents: reference/ind_nifty500list.csv
    manifest: artifacts/manifest.json

# ---------------------------------------------------------------- changelog
changelog:
  - {version: 1, date: "2026-08-28", note: "Initial design. 60L pool, 8.33% monthly target."}
  - {version: 3, date: "2026-08-30", note: "Recalibrated targets.msm_volatility from 0.75/0.60/0.45 to 2.65/2.00/1.65. The volatility estimator and the R-multiple ladder disagreed by 3.5x; found while implementing target_ladder.py."}
  - {version: 2, date: "2026-08-30", note: "80L pool, 5% monthly assessed quarterly, 50% recycling to 1Cr. Time stop 15->25 sessions with MS-decay requirement. Core promotion relaxed. Churn cap 3->2. ADV floors rescaled. Cap tilt sourced from NSE index membership rather than market caps."}
