name: Daily NSE data

on:
  schedule:
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Fetch the last N calendar days (use 400 for the first run)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet pandas numpy requests

      - name: Fetch NSE end-of-day files
        env:
          BACKFILL: ${{ github.event.inputs.backfill || '0' }}
        run: python scripts/fetch_nse.py --backfill "$BACKFILL" --allow-empty

      - name: Rebuild artifacts
        run: python scripts/build_artifacts.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data indices reference artifacts
          if git diff --staged --quiet; then
            echo "Nothing changed - market holiday, or files already present."
          else
            git commit -m "Data update"
            git push
          fi

      - name: Show manifest
        if: always()
        run: cat artifacts/manifest.json || echo "no manifest produced"
