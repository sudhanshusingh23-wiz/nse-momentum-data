name: Daily NSE data

on:
  schedule:
    # 14:00 UTC = 19:30 IST. NSE normally publishes sec_bhavdata_full around
    # 18:00-18:30 IST, so this leaves an hour of headroom. On 15 Sep 2026 a
    # 19:00 IST run fetched the index file but not the bhavcopy - cause not
    # established (late publication vs a transient fetch failure), so the real
    # protection is the rolling backfill below, not the exact run time.
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Fetch the last N calendar days (use 2100 for a full history rebuild)'
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet pandas numpy requests

      - name: Fetch NSE end-of-day files
        env:
          # A 7-day rolling window, not 0. THIS is the fix - it makes the exact
          # cron time a minor detail, because any file missed on one run is
          # retried on the next six. The fetch skips files that already exist,
          # so the cost is a handful of checks. With 0, a file missing at run
          # time was missing forever - ind_close_all_14092026.csv was lost
          # exactly this way.
          BACKFILL: ${{ github.event.inputs.backfill || '7' }}
        run: python scripts/fetch_nse.py --backfill "$BACKFILL" --allow-empty

      - name: Rebuild artifacts
        run: python scripts/build_artifacts.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data indices reference artifacts
          if git diff --staged --quiet; then
            echo "Nothing changed - market holiday, or files already present."
          else
            git commit -m "Data update"
            git push
          fi

      - name: Show manifest
        if: always()
        run: cat artifacts/manifest.json || echo "no manifest produced"

      - name: Warn if the latest session is stale
        if: always()
        run: |
          python - <<'PY'
          import json, datetime as dt
          try:
              m = json.load(open('artifacts/manifest.json'))
          except Exception as e:
              print('::warning::no manifest to check (%s)' % e); raise SystemExit
          latest = dt.date.fromisoformat(m['latest_session'])
          today = dt.datetime.utcnow().date()
          # count weekdays between the latest session and today
          gap, d = 0, latest
          while d < today:
              d += dt.timedelta(days=1)
              if d.weekday() < 5:
                  gap += 1
          print('latest session %s, %d weekday(s) behind %s' % (latest, gap, today))
          if gap >= 2:
              print('::warning::panel is %d weekdays stale (latest %s). NSE may have '
                    'published late, or the fetch failed. Re-run with a larger '
                    'backfill.' % (gap, latest))
          PY
