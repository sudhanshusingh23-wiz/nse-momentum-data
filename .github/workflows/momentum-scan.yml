name: Momentum scan

# Two modes, chosen from the Run workflow dropdown:
#
#   scan    Runs regime -> sector -> selector against the committed panel.
#           Tick `capture` to also pull the top 3 names from each of the top 3
#           sectors into the watchlist as Surfaced.
#
#           Capture is NOT gated by the regime. The regime decides whether you
#           may deploy; it does not decide what you may look at. The real regime
#           is still passed to the selector, so the ACTIONABLE/EXTENDED signal
#           stays truthful — it is recorded on the row, not used as a filter.
#   prices  Lane A. Refreshes last price for every tracked name from the
#           committed panel, plus the Nifty 500 for relative return. Touches
#           price fields only — never MS, gates or notes.
#
#   adopt   Turns Surfaced names into tracked ones. This is where price_at_add
#           is set, because that is the price at the moment you decide (R30).
#
# Surfacing is cheap and reversible; the eviction ladder prunes what you never
# adopt. Adopting is the decision, and it stays yours.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do'
        required: true
        default: 'scan'
        type: choice
        options: [scan, adopt, add, prices]
      capture:
        description: 'scan only — capture the top 3 per sector into the watchlist'
        required: false
        default: false
        type: boolean
      symbols:
        description: 'adopt/add — comma separated, e.g. KAYNES,AZAD'
        required: false
        default: ''
      prices:
        description: 'adopt/add — price, e.g. KAYNES=5810,AZAD=1842'
        required: false
        default: ''
      book:
        description: 'add only — which book'
        required: false
        default: 'momentum'
        type: choice
        options: [momentum, core]
      thesis:
        description: 'adopt/add — one line, applied to each name'
        required: false
        default: ''
      sectors:
        description: 'scan only — override sectors (blank = use the sector scan)'
        required: false
        default: ''
      show_n:
        description: 'scan only — candidates shown per sector'
        required: false
        default: '8'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet pandas numpy

      # ---------------------------------------------------------------- scan

      - name: Rebuild the symbol-to-sector map
        if: inputs.mode == 'scan'
        run: |
          python - <<'PY'
          import pandas as pd, pathlib
          src = pathlib.Path('reference/ind_nifty500list.csv')
          if not src.exists():
              raise SystemExit(f"MISSING: {src}. The scan chain cannot run without it.")
          c = pd.read_csv(src)
          c.columns = [x.strip() for x in c.columns]
          c = c[c.Industry != 'Diversified']
          out = c[['Symbol', 'Industry']].rename(
              columns={'Symbol': 'symbol', 'Industry': 'sector'})
          out.to_csv('reference/map.csv', index=False)
          print(f"map.csv rebuilt: {len(out)} symbols, {out.sector.nunique()} sectors")
          PY

      - name: Check inputs exist
        if: inputs.mode == 'scan'
        run: |
          missing=0
          for f in artifacts/panel.csv.gz artifacts/nifty500.csv reference/map.csv; do
            if [ ! -f "$f" ]; then echo "MISSING (required): $f"; missing=1; fi
          done
          for f in artifacts/caps.csv artifacts/sector_indices.csv artifacts/breadth.json \
                   artifacts/nifty50.csv artifacts/smallcap250.csv artifacts/vix.csv; do
            [ -f "$f" ] || echo "missing (optional, will degrade): $f"
          done
          [ "$missing" = "0" ] || exit 1
          mkdir -p state

      - name: L1 — regime
        if: inputs.mode == 'scan'
        run: |
          ARGS=(--benchmark artifacts/nifty500.csv --json state/regime_scan.json)
          [ -f artifacts/breadth.json ]    && ARGS+=(--breadth-json artifacts/breadth.json)
          [ -f artifacts/nifty50.csv ]     && ARGS+=(--largecap-index artifacts/nifty50.csv)
          [ -f artifacts/smallcap250.csv ] && ARGS+=(--smallcap artifacts/smallcap250.csv)
          [ -f artifacts/vix.csv ]         && ARGS+=(--vix artifacts/vix.csv)
          [ -f state/regime_state.json ]   && ARGS+=(--state state/regime_state.json)
          printf 'regime_score.py'; printf ' %q' "${ARGS[@]}"; echo
          python scripts/regime_score.py "${ARGS[@]}"

      - name: Read the regime
        if: inputs.mode == 'scan'
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          d = json.load(open('state/regime_scan.json'))
          r = d.get('state_after_transition') or d.get('state_raw')
          if not r:
              raise SystemExit("Could not read regime. Keys present: " + ", ".join(d))
          print(f"REGIME={r}")
          PY
          grep REGIME= "$GITHUB_ENV" | tail -1

      - name: L2 — sector rotation
        if: inputs.mode == 'scan'
        run: |
          ARGS=(--prices artifacts/panel.csv.gz --map reference/map.csv
                --regime "$REGIME" --json state/sector_scan.json
                --out-state state/sector_state.json)
          [ -f artifacts/sector_indices.csv ] && ARGS+=(--sector-index artifacts/sector_indices.csv)
          [ -f state/sector_state.json ]      && ARGS+=(--state state/sector_state.json)
          printf 'sector_score.py'; printf ' %q' "${ARGS[@]}"; echo
          python scripts/sector_score.py "${ARGS[@]}"

      - name: Read the top sectors
        if: inputs.mode == 'scan'
        env:
          OVERRIDE: ${{ inputs.sectors }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os
          ov = os.environ.get('OVERRIDE', '').strip()
          if ov:
              print(f"SECTORS={ov}")
              raise SystemExit(0)
          d = json.load(open('state/sector_scan.json'))
          # Deliberately NOT `selected`. That field answers "may capital be
          # deployed here", which is a different question from "what is
          # strongest right now". The watchlist wants the latter: the top 3 by
          # SMS every week, regardless of whether the regime permits entry.
          # A drawdown is exactly when a watchlist should be filling up.
          rank = sorted((d.get('ranking') or []), key=lambda r: r.get('rank', 999))
          names = [r['sector'] for r in rank[:3] if r.get('sector')]
          if not names:
              raise SystemExit("Sector ranking is empty — L2 produced nothing to rank.")
          print("SECTORS=" + ",".join(names))
          PY
          grep SECTORS= "$GITHUB_ENV" | tail -1

      - name: Report regime and sectors
        if: always() && inputs.mode == 'scan'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          def load(p):
              try: return json.load(open(p))
              except Exception as e: return {"_error": str(e)}
          r = load('state/regime_scan.json'); s = load('state/sector_scan.json')
          print("## L1 regime\n")
          if "_error" in r:
              print("Not produced: `%s`\n" % r["_error"])
          else:
              print(f"**{r.get('state_after_transition')}** · score {r.get('composite_score')} "
                    f"· as of {r.get('asof')}\n")
              if r.get('components_missing'): print(f"Components missing: {r['components_missing']}\n")
              print("| Component | Score | Weight |")
              print("|---|---:|---:|")
              for k, v in (r.get('components') or {}).items():
                  print(f"| {k} | {v.get('score')} | {v.get('weight')} |")
              print()
          print("## L2 sectors\n")
          if "_error" in s:
              print("Not produced: `%s`\n" % s["_error"])
          else:
              sel = s.get('selected') or []
              print(f"Cleared for deployment: **{sel if sel else 'none — regime blocks entry'}**\n")
              print("The watchlist captures the top 3 by SMS regardless of this.\n")
              print("| Rank | Sector | SMS | Breadth |")
              print("|---:|---|---:|---:|")
              for row in (s.get('ranking') or [])[:15]:
                  print(f"| {row.get('rank')} | {row.get('sector')} | {row.get('SMS')} "
                        f"| {row.get('breadth_raw')} |")
              print()
              for n in (s.get('notes') or []): print(f"- {n}")
          PY

      - name: L3 — stock selection
        if: inputs.mode == 'scan'
        run: |
          ARGS=(--panel artifacts/panel.csv.gz --map reference/map.csv
                --benchmark artifacts/nifty500.csv
                --sectors "$SECTORS"
                --regime "$REGIME" --sms state/sector_scan.json
                --show-n "${{ inputs.show_n }}" --json state/last_scan.json)
          [ -f artifacts/caps.csv ] && ARGS+=(--caps artifacts/caps.csv)
          printf 'stock_select.py'; printf ' %q' "${ARGS[@]}"; echo
          python scripts/stock_select.py "${ARGS[@]}"

      - name: Summarise the shortlist
        if: inputs.mode == 'scan'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('state/last_scan.json'))
          sl = d.get('shortlist', [])
          print(f"## Scan — {d.get('asof')}\n")
          print(f"Regime **{d.get('regime')}** · {len(sl)} candidates\n")
          if sl:
              print("| Symbol | MS | Rank | Sector | Cap |")
              print("|---|---:|---:|---|---|")
              for s in sl:
                  print(f"| {s.get('symbol')} | {s.get('ms')} | {s.get('rank')} "
                        f"| {s.get('sector','')} | {s.get('cap','')} |")
              print("\nTo track any of these, run this workflow again with "
                    "**mode: ingest** and paste the symbols.")
          PY

      # -------------------------------------------------------------- ingest

      - name: Capture the top 3 per sector
        if: inputs.mode == 'scan' && inputs.capture
        run: |
          [ -f state/watchlist.json ] || \
            python scripts/watchlist.py --path state/watchlist.json init
          python scripts/watchlist.py --path state/watchlist.json ingest \
            --json state/last_scan.json --all | tee /tmp/out.txt
          { echo; echo '## Captured'; echo; echo '```'; cat /tmp/out.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Lane A — refresh prices
        if: inputs.mode == 'prices'
        run: |
          if [ ! -f state/watchlist.json ]; then
            echo "No watchlist yet. Add or capture a name first."; exit 1
          fi
          ARGS=(prices --panel artifacts/panel.csv.gz)
          [ -f artifacts/nifty500.csv ] && ARGS+=(--benchmark artifacts/nifty500.csv)
          python scripts/watchlist.py --path state/watchlist.json "${ARGS[@]}" \
            | tee /tmp/out.txt
          { echo '## Prices'; echo; echo '```'; cat /tmp/out.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Add by hand
        if: inputs.mode == 'add'
        env:
          SYMBOLS: ${{ inputs.symbols }}
          PRICES: ${{ inputs.prices }}
          THESIS: ${{ inputs.thesis }}
        run: |
          if [ -z "$SYMBOLS" ]; then echo "No symbols given."; exit 1; fi
          [ -f state/watchlist.json ] || \
            python scripts/watchlist.py --path state/watchlist.json init
          declare -A PX
          IFS=',' read -ra PAIRS <<< "$PRICES"
          for p in "${PAIRS[@]}"; do
            p="$(echo "$p" | xargs)"
            [ -n "$p" ] && PX["${p%%=*}"]="${p#*=}"
          done
          IFS=',' read -ra SYMS <<< "$SYMBOLS"
          for sym in "${SYMS[@]}"; do
            sym="$(echo "$sym" | xargs)"; [ -z "$sym" ] && continue
            ARGS="add $sym --book ${{ inputs.book }}"
            [ -n "${PX[$sym]}" ] && ARGS="$ARGS --price ${PX[$sym]}"
            [ -n "$THESIS" ] && ARGS="$ARGS --thesis \"$THESIS\""
            eval python scripts/watchlist.py --path state/watchlist.json $ARGS
          done
          python scripts/watchlist.py --path state/watchlist.json validate

      - name: Adopt
        if: inputs.mode == 'adopt'
        env:
          SYMBOLS: ${{ inputs.symbols }}
          PRICES: ${{ inputs.prices }}
          THESIS: ${{ inputs.thesis }}
        run: |
          if [ -z "$SYMBOLS" ]; then echo "No symbols given."; exit 1; fi
          declare -A PX
          IFS=',' read -ra PAIRS <<< "$PRICES"
          for p in "${PAIRS[@]}"; do
            p="$(echo "$p" | xargs)"
            [ -n "$p" ] && PX["${p%%=*}"]="${p#*=}"
          done
          IFS=',' read -ra SYMS <<< "$SYMBOLS"
          for sym in "${SYMS[@]}"; do
            sym="$(echo "$sym" | xargs)"; [ -z "$sym" ] && continue
            price="${PX[$sym]}"
            if [ -z "$price" ]; then
              echo "::error::No price for $sym. Give it as $sym=1234 in prices."; exit 1
            fi
            ARGS="adopt $sym --price $price"
            [ -n "$THESIS" ] && ARGS="$ARGS --thesis \"$THESIS\""
            eval python scripts/watchlist.py --path state/watchlist.json $ARGS
          done
          python scripts/watchlist.py --path state/watchlist.json validate

      - name: Show the watchlist
        if: always() && (inputs.mode != 'scan' || inputs.capture)
        run: |
          { echo; echo '```'
            python scripts/watchlist.py --path state/watchlist.json list
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------------------- commit

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state reference/map.csv 2>/dev/null || git add state
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "${{ inputs.mode }}: state update"
            git push
          fi

      - name: Upload scan output
        if: always() && inputs.mode == 'scan'
        uses: actions/upload-artifact@v5
        with:
          name: scan-json
          path: state/*.json
          if-no-files-found: ignore
